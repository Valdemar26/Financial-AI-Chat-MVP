services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_ai_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/financial_ai_chat
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/financial_ai_chat
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
